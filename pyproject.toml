[project]
name = "brightsmile-dental-ai"
version = "0.1.0"
description = "AI customer-service agent demo for a fictional dental clinic"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: LLM evaluation cases (real LLM, slow, costs money); run with `pytest -m eval`",
]
